<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>아기자기한 패드 인터페이스</title>
    <style>
        /* 폰트 정의 (제공된 교보손글씨 폰트명 반영)[span_1](start_span)[span_1](end_span) */
        @font-face {
            font-family: 'KyoboHandwriting';
            src: local('Kyobo Handwriting 2022 khn Regular'), local('KyoboHandwriting2022khn');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'KyoboHandwriting', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* 패드 화면 프레임 (깔끔하고 아기자기한 디자인, 명암 제거) */
        .pad-container {
            width: 100%;
            max-width: 768px;
            height: 100%;
            max-height: 1024px;
            background-color: #ffffff;
            border: 4px solid #e2e8f0;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            padding: 24px;
            position: relative;
        }

        /* 상단 헤더 영역 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px dashed #edf2f7;
        }

        h1 {
            font-size: 24px;
            color: #4a5568;
        }

        .font-selector {
            font-size: 14px;
            padding: 6px 12px;
            border: 2px solid #cbd5e0;
            border-radius: 12px;
            background: #fff;
            color: #4a5568;
            outline: none;
            cursor: pointer;
        }

        /* 메인 컨텐츠 영역 (화면 잘림 방지 및 유연한 배치) */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        /* 카드 컴포넌트 (명암 없이 깔끔한 테두리 중심) */
        .card {
            background-color: #fffaf0;
            border: 2px solid #feebc8;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-title {
            font-size: 18px;
            color: #d69e2e;
        }

        .card-desc {
            font-size: 14px;
            color: #718096;
            line-height: 1.4;
        }

        /* 텍스트와 드래그 버튼 겹침 해결을 위한 Flex 분리 배치 */
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 20px;
            gap: 16px;
        }

        .text-area {
            flex: 1;
            font-size: 15px;
            color: #2d3748;
            word-break: break-all;
        }

        /* 드래그/인터랙션 버튼 (겹침 방지 및 명확한 독립 공간 확보) */
        .action-btn {
            background-color: #68d391;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: #48bb78;
        }

        /* 하단 네비게이션 바 */
        footer {
            display: flex;
            justify-content: space-around;
            padding-top: 16px;
            border-top: 2px dashed #edf2f7;
        }

        .nav-item {
            background: none;
            border: none;
            font-size: 14px;
            color: #a0aec0;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 12px;
        }

        .nav-item.active {
            background-color: #ebf8ff;
            color: #3182ce;
        }
    </style>
</head>
<body>

    <div class="pad-container" id="appContainer">
        <!-- 상단 헤더 -->
        <header>
            <h1>아기자기 패드</h1>
            <select class="font-selector" id="fontSelector" onchange="changeFont(this.value)">
                <option value="KyoboHandwriting">교보손글씨체</option>
                <option value="Malgun Gothic">기본 고딕체</option>
            </select>
        </header>

        <!-- 메인 인터페이스 영역 -->
        <div class="main-content">
            <div class="card">
                <div class="card-title">✨ 환영합니다!</div>
                <div class="card-desc">명암을 없애고 화면에 딱 맞게 구성된 깔끔한 인터페이스입니다. 텍스트와 버튼이 겹치지 않도록 간격이 조정되었습니다.</div>
            </div>

            <!-- 텍스트와 버튼이 겹치지 않는 독립 배치 영역 1 -->
            <div class="control-row">
                <div class="text-area">
                    <strong>설정 확인:</strong> 현재 폰트와 레이아웃이 정상적으로 적용되어 있습니다.
                </div>
                <button class="action-btn" onclick="alert('버튼이 클릭되었습니다!')">선택하기</button>
            </div>

            <!-- 텍스트와 버튼이 겹치지 않는 독립 배치 영역 2 -->
            <div class="control-row">
                <div class="text-area">
                    <strong>인터페이스 조정:</strong> 패드 화면 크기에 맞추어 모든 요소가 한눈에 들어옵니다.
                </div>
                <button class="action-btn" style="background-color: #63b3ed;" onclick="alert('설정이 변경되었습니다!')">변경하기</button>
            </div>
        </div>

        <!-- 하단 네비게이션 -->
        <footer>
            <button class="nav-item active">홈</button>
            <button class="nav-item">설정</button>
            <button class="nav-item">정보</button>
        </footer>
    </div>

    <script>
        // 폰트 변경 함수
        function changeFont(fontName) {
            const container = document.getElementById('appContainer');
            if (fontName === 'KyoboHandwriting') {
                container.style.fontFamily = "'KyoboHandwriting', sans-serif";
            } else {
                container.style.fontFamily = "'Malgun Gothic', sans-serif";
            }
        }
    </script>
</body>
</html>
